<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %} · L230518_A2_Ops</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('vg.index') }}"><span class="logo">◉</span> VisionGuard</a>
    <nav>
      <a href="{{ url_for('vg.index') }}" class="{{ 'on' if request.endpoint == 'vg.index' }}">Upload</a>
      <a href="{{ url_for('vg.history') }}" class="{{ 'on' if request.endpoint == 'vg.history' }}">History</a>
      <a href="{{ url_for('vg.health') }}">Health</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>L230518_A2_Ops · AI-generated vs real image classifier · MobileNetV2 fine-tuned</footer>
</body>
</html>
