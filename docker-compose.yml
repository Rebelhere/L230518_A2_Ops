# One command: docker compose up -d --build
name: l230518_a2_ops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data          # named volume: history survives container rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # no "ports:" -> Postgres is reachable only on the internal compose network

  web:
    build: .
    image: l230518_a2_ops-web
    depends_on:
      db:
        condition: service_healthy                # wait until Postgres accepts connections
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /models/champion.keras
      THRESHOLD: ${THRESHOLD:-0.771}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      INFERENCE_MODE: ${INFERENCE_MODE:-local}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./models:/models:ro                       # champion model mounted read-only (exported from the registry)
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pgdata:
